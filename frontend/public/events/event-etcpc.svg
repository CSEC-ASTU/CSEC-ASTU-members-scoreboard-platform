<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-cp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d14"/>
      <stop offset="50%" stop-color="#181520"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <radialGradient id="glow-cp" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-cp" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg-grad-cp)"/>
  <rect width="640" height="360" fill="url(#grid-cp)"/>
  <circle cx="320" cy="160" r="180" fill="url(#glow-cp)"/>

  <!-- Code / Terminal Window Box -->
  <g transform="translate(140, 70)">
    <rect width="360" height="190" rx="12" fill="#09090b" fill-opacity="0.85" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <!-- Window Controls -->
    <circle cx="20" cy="18" r="4.5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="36" cy="18" r="4.5" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="52" cy="18" r="4.5" fill="#10b981" fill-opacity="0.8"/>
    <line x1="0" y1="34" x2="360" y2="34" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Code Snippet -->
    <text x="24" y="66" font-family="monospace" font-size="13" fill="#a855f7" font-weight="bold">#include &lt;bits/stdc++.h&gt;</text>
    <text x="24" y="90" font-family="monospace" font-size="13" fill="#60a5fa">int <tspan fill="#f59e0b">solve</tspan>() {</text>
    <text x="48" y="114" font-family="monospace" font-size="13" fill="#94a3b8">  vector&lt;ll&gt; dp(n + 1, 0);</text>
    <text x="48" y="138" font-family="monospace" font-size="13" fill="#10b981">  // Verdict: Accepted [0.04s]</text>
    <text x="24" y="162" font-family="monospace" font-size="13" fill="#60a5fa">}</text>
  </g>

  <!-- Graphic Accents -->
  <path d="M 100 180 L 120 180 M 520 180 L 540 180" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <text x="320" y="310" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(251, 191, 36, 0.7)" letter-spacing="4">ALGORITHMS · ETCPC QUALIFIER · ICPC TRACK</text>
</svg>
