<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d14"/>
      <stop offset="50%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <radialGradient id="glow-ai" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-ai" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg-grad-ai)"/>
  <rect width="640" height="360" fill="url(#grid-ai)"/>
  <circle cx="320" cy="160" r="180" fill="url(#glow-ai)"/>

  <!-- Neural Mesh / Graph Connections -->
  <g stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.5">
    <line x1="160" y1="180" x2="260" y2="120"/>
    <line x1="160" y1="180" x2="260" y2="220"/>
    <line x1="260" y1="120" x2="380" y2="100"/>
    <line x1="260" y1="120" x2="380" y2="180"/>
    <line x1="260" y1="220" x2="380" y2="180"/>
    <line x1="260" y1="220" x2="380" y2="250"/>
    <line x1="380" y1="100" x2="480" y2="160"/>
    <line x1="380" y1="180" x2="480" y2="160"/>
    <line x1="380" y1="250" x2="480" y2="160"/>
    <line x1="380" y1="100" x2="380" y2="180"/>
    <line x1="380" y1="180" x2="380" y2="250"/>
  </g>

  <!-- Pulses and Waves -->
  <circle cx="320" cy="160" r="90" fill="none" stroke="rgba(139, 92, 246, 0.15)" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="320" cy="160" r="130" fill="none" stroke="rgba(139, 92, 246, 0.08)" stroke-width="1"/>

  <!-- Nodes -->
  <circle cx="160" cy="180" r="7" fill="#6366f1"/>
  <circle cx="260" cy="120" r="8" fill="#8b5cf6"/>
  <circle cx="260" cy="220" r="6" fill="#a855f7"/>
  <circle cx="380" cy="100" r="9" fill="#c084fc"/>
  <circle cx="380" cy="180" r="11" fill="#ec4899"/>
  <circle cx="380" cy="250" r="7" fill="#8b5cf6"/>
  <circle cx="480" cy="160" r="10" fill="#a855f7"/>

  <!-- Glowing Centers -->
  <circle cx="380" cy="180" r="4" fill="#ffffff"/>
  <circle cx="480" cy="160" r="3" fill="#ffffff"/>

  <!-- Abstract Vector Typography -->
  <text x="320" y="310" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(216, 180, 254, 0.7)" letter-spacing="4">AGENTIC AI · EMBEDDINGS · LLM SYSTEMS</text>
</svg>
